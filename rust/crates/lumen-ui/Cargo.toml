[package]
name = "lumen-ui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "Lumen"
path = "src/main.rs"

[dependencies]
lumen-core = { workspace = true }
lumen-platform = { workspace = true }
lumen-engines = { workspace = true }
lumen-app = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
# Colour (COLR) glyphs, e.g. emoji in server names, as Qt draws them.
epaint = { version = "0.37", features = ["color_fonts"] }
egui_extras = { workspace = true, features = ["svg"] }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
windows = { workspace = true }
tray-icon = { workspace = true }
muda = { workspace = true }
arboard = { version = "3.7", default-features = false }
qrcode = { workspace = true }

[target.'cfg(windows)'.dependencies]
egui-winit = { version = "0.37", default-features = false, features = ["arboard"] }

[dev-dependencies]
sha2 = { workspace = true }
