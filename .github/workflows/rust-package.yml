name: Package and publish Windows Rust

on:
  workflow_call:
    inputs:
      prerelease:
        required: true
        type: boolean
      publish:
        required: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-rust-release-${{ inputs.prerelease }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine package version and release tag
        id: version
        working-directory: windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $version = python -c "from build_rust import read_rust_version; print(read_rust_version())"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected a stable X.Y.Z version in rust/Cargo.toml"
          }

          $tags = @(git tag --list)
          if ($LASTEXITCODE -ne 0) { throw "Could not list repository tags" }
          if ($env:PRERELEASE -eq 'true') {
            $releaseTags = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
            if ($LASTEXITCODE -ne 0) { throw "Could not list GitHub releases" }
            $pattern = "^v?$([regex]::Escape($version))-pre\.(\d+)$"
            $last = 0
            foreach ($tag in ($tags + $releaseTags)) {
              if ($tag -match $pattern) { $last = [Math]::Max($last, [int]$Matches[1]) }
            }
            $version = '{0}-pre.{1:D2}' -f $version, ($last + 1)
          }

          $tag = "v$version"
          if ($tags -ccontains $tag) {
            $tagCommit = git rev-parse "refs/tags/$tag^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
              throw "Tag $tag already points to a different commit"
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Packaging Lumen $version for $tag"

      - name: Set up Rust
        run: rustup default stable-x86_64-pc-windows-msvc

      - name: Run Rust tests
        working-directory: rust
        env:
          LUMEN_PARITY_DUMP: ${{ runner.temp }}\lumen-config-parity.json
        run: cargo test --locked --workspace --lib --tests

      - name: Upload configuration parity failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-config-parity-failures
          path: ${{ runner.temp }}\lumen-config-parity.json
          if-no-files-found: ignore

      - name: Cache Inno Setup
        id: cache-inno
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\Inno Setup 6
          key: innosetup-6

      - name: Install Inno Setup
        if: steps.cache-inno.outputs.cache-hit != 'true'
        run: choco install innosetup --yes --no-progress

      - name: Resolve core releases
        id: core-releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; "User-Agent" = "Lumen-CI" }
          $xrayReleases = Invoke-RestMethod "https://api.github.com/repos/XTLS/Xray-core/releases?per_page=30" -Headers $headers
          $xray = $xrayReleases |
            Where-Object { -not $_.draft -and $_.tag_name -match '^v?\d+\.\d+\.\d+' } |
            Sort-Object { [version](([regex]::Matches($_.tag_name, '\d+') | ForEach-Object Value)[0..2] -join '.') } -Descending |
            Select-Object -First 1
          if (-not $xray) { throw "No compatible Xray release found" }
          $singbox = Invoke-RestMethod "https://api.github.com/repos/shtorm-7/sing-box-extended/releases/latest" -Headers $headers
          $geodata = Invoke-RestMethod "https://api.github.com/repos/runetfreedom/russia-v2ray-rules-dat/releases/latest" -Headers $headers
          "xray-tag=$($xray.tag_name)" >> $env:GITHUB_OUTPUT
          "singbox-tag=$($singbox.tag_name)" >> $env:GITHUB_OUTPUT
          "geodata-tag=$($geodata.tag_name)" >> $env:GITHUB_OUTPUT
          "cache-key=$($xray.id)-$($singbox.id)-$($geodata.id)-wintun-0.14.1-rulesets-v2-metadata-v3-lumen-masque-v1-naive-v1" >> $env:GITHUB_OUTPUT

      - name: Cache core binaries
        id: cache-cores
        uses: actions/cache@v4
        with:
          path: windows/core
          key: cores-${{ runner.os }}-${{ steps.core-releases.outputs.cache-key }}-${{ hashFiles('windows/scripts/build_singbox_extended.ps1', 'windows/patches/*.patch') }}

      - name: Set up Go for sing-box
        if: steps.cache-cores.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false

      - name: Prepare bundled cores and geodata
        if: steps.cache-cores.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XRAY_TAG: ${{ steps.core-releases.outputs.xray-tag }}
          SINGBOX_TAG: ${{ steps.core-releases.outputs.singbox-tag }}
          GEODATA_TAG: ${{ steps.core-releases.outputs.geodata-tag }}
        run: |
          $downloads = Join-Path $env:RUNNER_TEMP "lumen-cores"
          New-Item -ItemType Directory -Force -Path $downloads, windows/core/rule-sets | Out-Null
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; "User-Agent" = "Lumen-CI" }

          $xrayRelease = Invoke-RestMethod "https://api.github.com/repos/XTLS/Xray-core/releases/tags/$env:XRAY_TAG" -Headers $headers
          $xrayAsset = $xrayRelease.assets | Where-Object { $_.name -eq "Xray-windows-64.zip" } | Select-Object -First 1
          if (-not $xrayAsset) { throw "Xray Windows x64 asset missing in $env:XRAY_TAG" }
          $xrayZip = Join-Path $downloads "xray.zip"
          $xrayDir = Join-Path $downloads "xray"
          Invoke-WebRequest $xrayAsset.browser_download_url -OutFile $xrayZip
          Expand-Archive $xrayZip -DestinationPath $xrayDir
          Copy-Item (Join-Path $xrayDir "xray.exe") windows/core/

          $geoBase = "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/download/$env:GEODATA_TAG"
          $geoZip = Join-Path $downloads "geodata-singbox.zip"
          $geoDir = Join-Path $downloads "geodata-singbox"
          Invoke-WebRequest "$geoBase/geoip.dat" -OutFile windows/core/geoip.dat
          Invoke-WebRequest "$geoBase/geosite.dat" -OutFile windows/core/geosite.dat
          Invoke-WebRequest "$geoBase/sing-box.zip" -OutFile $geoZip
          Expand-Archive $geoZip -DestinationPath $geoDir
          $ruleSetSources = [ordered]@{
            "geosite:category-ru" = "archive:rule-set-geosite/geosite-category-ru.srs"
            "geosite:ru-available-only-inside" = "archive:rule-set-geosite/geosite-ru-available-only-inside.srs"
            "geosite:ru-blocked" = "archive:rule-set-geosite/geosite-ru-blocked.srs"
            "geoip:ru" = "archive:rule-set-geoip/geoip-ru.srs"
            "geoip:ru-blocked" = "archive:rule-set-geoip/geoip-ru-blocked.srs"
            "geoip:ru-blocked-community" = "archive:rule-set-geoip/geoip-ru-blocked-community.srs"
          }
          $ruleSetHashes = [ordered]@{}
          foreach ($source in $ruleSetSources.Values) {
            $ruleSet = $source.Substring("archive:".Length)
            Copy-Item (Join-Path $geoDir $ruleSet) windows/core/rule-sets/
            $filename = Split-Path $ruleSet -Leaf
            $ruleSetHashes[$filename] = (Get-FileHash (Join-Path windows/core/rule-sets $filename) -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          [ordered]@{
            schema = 3
            region = "russia"
            version = $env:GEODATA_TAG
            rule_sets = $ruleSetSources
            sha256 = [ordered]@{
              "geoip.dat" = (Get-FileHash windows/core/geoip.dat -Algorithm SHA256).Hash.ToLowerInvariant()
              "geosite.dat" = (Get-FileHash windows/core/geosite.dat -Algorithm SHA256).Hash.ToLowerInvariant()
              "sing-box.zip" = (Get-FileHash $geoZip -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            rule_set_sha256 = $ruleSetHashes
          } | ConvertTo-Json -Depth 5 | Set-Content windows/core/lumen-geodata.json -Encoding utf8

          $wintunZip = Join-Path $downloads "wintun.zip"
          $wintunDir = Join-Path $downloads "wintun"
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile $wintunZip
          Expand-Archive $wintunZip -DestinationPath $wintunDir
          Copy-Item (Join-Path $wintunDir "wintun/bin/amd64/wintun.dll") windows/core/

          & ./windows/scripts/build_singbox_extended.ps1 -OutputPath windows/core/sing-box-extended/sing-box.exe -Ref $env:SINGBOX_TAG

      - name: Build Rust app, installer and portable archive
        working-directory: windows
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: python build.py --version $env:PACKAGE_VERSION

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Windows-Rust-x64
          if-no-files-found: error
          path: |
            rust/dist/Lumen-Setup-windows-x64.exe
            rust/dist/Lumen-portable-windows-x64.zip

      - name: Generate release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if ($env:PRERELEASE -eq 'false') {
            $heading = [regex]::Escape("## Desktop $env:RELEASE_TAG")
            $section = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^$heading[ \t]*\r?\n(.*?)(?=^## |\z)")
            if ($section.Success) {
              $section.Groups[1].Value.Trim() | Set-Content release-notes.md -Encoding utf8
              exit 0
            }
          }

          $stablePattern = '^v\d+\.\d+\.\d+$'
          $previousPattern = $stablePattern
          if ($env:PRERELEASE -eq 'true') {
            $baseTag = $env:RELEASE_TAG -replace '-pre\.\d+$', ''
            $previousPattern = "^$([regex]::Escape($baseTag))-pre\.\d+$"
          }
          $tags = @(git tag --merged HEAD --sort=-version:refname)
          if ($LASTEXITCODE -ne 0) { throw "Could not list tags reachable from HEAD" }
          $previous = $tags | Where-Object { $_ -ne $env:RELEASE_TAG -and $_ -match $previousPattern } | Select-Object -First 1
          if (-not $previous -and $env:PRERELEASE -eq 'true') {
            $previous = $tags | Where-Object { $_ -ne $baseTag -and $_ -match $stablePattern } | Select-Object -First 1
          }
          $range = if ($previous) { "$previous..HEAD" } else { "HEAD" }
          $log = @(git log $range --no-merges --pretty=format:'- %s (%h)')
          if ($LASTEXITCODE -ne 0) { throw "Could not generate release notes" }
          if (-not $log) { $log = @("- No new commits") }
          if ($previous) { $log += "", "Full Changelog: https://github.com/$env:GITHUB_REPOSITORY/compare/$previous...$env:RELEASE_TAG" }
          (@("## Changes", "") + $log) | Set-Content release-notes.md -Encoding utf8

      - name: Publish GitHub release
        if: inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Lumen ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ !inputs.prerelease }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            rust/dist/Lumen-Setup-windows-x64.exe
            rust/dist/Lumen-portable-windows-x64.zip
