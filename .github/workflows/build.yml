name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine version
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          $file = "windows/xray_fluent/constants.py"
          $content = Get-Content $file -Raw
          if ($content -notmatch 'APP_VERSION\s*=\s*"([^"]+)"') {
            throw "APP_VERSION not found"
          }
          $version = $Matches[1]
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          Write-Host "Release version: $version (tag: v$version)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.txt

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('windows/requirements.txt') }}

      - name: Cache Inno Setup
        id: cache-inno
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\Inno Setup 6
          key: innosetup-6

      - name: Install Inno Setup
        if: steps.cache-inno.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Resolve core releases
        id: core-releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; "User-Agent" = "Lumen-CI" }
          $xray = Invoke-RestMethod "https://api.github.com/repos/XTLS/Xray-core/releases?per_page=30" -Headers $headers |
            Where-Object { -not $_.draft -and $_.tag_name -match '^v?\d+\.\d+\.\d+' } |
            Sort-Object { [version](([regex]::Matches($_.tag_name, '\d+') | ForEach-Object Value)[0..2] -join '.') } -Descending |
            Select-Object -First 1
          $singbox = Invoke-RestMethod "https://api.github.com/repos/shtorm-7/sing-box-extended/releases/latest" -Headers $headers
          $geodata = Invoke-RestMethod "https://api.github.com/repos/runetfreedom/russia-v2ray-rules-dat/releases/latest" -Headers $headers
          "cache-key=$($xray.id)-$($singbox.id)-$($geodata.id)-wintun-0.14.1-rulesets-v2-metadata-v3-lumen-masque-v1-naive-v1" >> $env:GITHUB_OUTPUT

      - name: Cache core binaries
        id: cache-cores
        uses: actions/cache@v4
        with:
          path: windows/core
          key: cores-${{ runner.os }}-${{ steps.core-releases.outputs.cache-key }}

      - name: Set up Go for sing-box
        if: steps.cache-cores.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true

      - name: Download core binaries
        if: steps.cache-cores.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path windows/core | Out-Null
          $githubHeaders = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "Lumen-CI"
          }

          Write-Host "Downloading Xray-core..."
          $xrayReleases = Invoke-RestMethod "https://api.github.com/repos/XTLS/Xray-core/releases?per_page=30" -Headers $githubHeaders
          $xrayRelease = $xrayReleases |
            Where-Object { -not $_.draft -and $_.tag_name -match '^v?\d+\.\d+\.\d+' } |
            Sort-Object {
              $parts = [regex]::Matches($_.tag_name, '\d+') | ForEach-Object { [int]$_.Value }
              [version]::new($parts[0], $parts[1], $parts[2])
            } -Descending |
            Select-Object -First 1
          Write-Host "Using Xray-core $($xrayRelease.tag_name)"
          $xrayAsset = $xrayRelease.assets | Where-Object { $_.name -match "Xray-windows-64\.zip$" }
          Invoke-WebRequest $xrayAsset.browser_download_url -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath _xray -Force
          Copy-Item _xray/xray.exe windows/core/
          Remove-Item -Recurse _xray, xray.zip

          Write-Host "Downloading RuNetFreedom geoip/geosite..."
          $geoRelease = Invoke-RestMethod "https://api.github.com/repos/runetfreedom/russia-v2ray-rules-dat/releases/latest" -Headers $githubHeaders
          $geoBase = "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download"
          Invoke-WebRequest "$geoBase/geoip.dat" -OutFile windows/core/geoip.dat
          Invoke-WebRequest "$geoBase/geosite.dat" -OutFile windows/core/geosite.dat
          Invoke-WebRequest "$geoBase/sing-box.zip" -OutFile geodata-singbox.zip
          Expand-Archive geodata-singbox.zip -DestinationPath _geodata-singbox -Force
          New-Item -ItemType Directory -Force -Path windows/core/rule-sets | Out-Null
          $ruleSetSources = [ordered]@{
            "geosite:category-ru" = "archive:rule-set-geosite/geosite-category-ru.srs"
            "geosite:ru-available-only-inside" = "archive:rule-set-geosite/geosite-ru-available-only-inside.srs"
            "geosite:ru-blocked" = "archive:rule-set-geosite/geosite-ru-blocked.srs"
            "geoip:ru" = "archive:rule-set-geoip/geoip-ru.srs"
            "geoip:ru-blocked" = "archive:rule-set-geoip/geoip-ru-blocked.srs"
            "geoip:ru-blocked-community" = "archive:rule-set-geoip/geoip-ru-blocked-community.srs"
          }
          $ruleSetHashes = [ordered]@{}
          foreach ($source in $ruleSetSources.Values) {
            $ruleSet = $source.Substring("archive:".Length)
            Copy-Item (Join-Path _geodata-singbox $ruleSet) windows/core/rule-sets/
            $filename = Split-Path $ruleSet -Leaf
            $ruleSetHashes[$filename] = (Get-FileHash (Join-Path windows/core/rule-sets $filename) -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $metadata = [ordered]@{
            schema = 3
            region = "russia"
            version = [string]$geoRelease.tag_name
            rule_sets = $ruleSetSources
            sha256 = [ordered]@{
              "geoip.dat" = (Get-FileHash windows/core/geoip.dat -Algorithm SHA256).Hash.ToLowerInvariant()
              "geosite.dat" = (Get-FileHash windows/core/geosite.dat -Algorithm SHA256).Hash.ToLowerInvariant()
              "sing-box.zip" = (Get-FileHash geodata-singbox.zip -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            rule_set_sha256 = $ruleSetHashes
          }
          $metadata | ConvertTo-Json -Depth 5 | Set-Content windows/core/lumen-geodata.json -Encoding utf8
          Remove-Item -Recurse _geodata-singbox, geodata-singbox.zip

          Write-Host "Downloading wintun..."
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath _wintun -Force
          Copy-Item _wintun/wintun/bin/amd64/wintun.dll windows/core/
          Remove-Item -Recurse _wintun, wintun.zip

          Write-Host "Building Lumen-compatible sing-box-extended..."
          $sbRelease = Invoke-RestMethod "https://api.github.com/repos/shtorm-7/sing-box-extended/releases/latest" -Headers $githubHeaders
          Write-Host "Using sing-box $($sbRelease.tag_name)"
          & ./windows/scripts/build_singbox_extended.ps1 -OutputPath windows/core/sing-box.exe -Ref $sbRelease.tag_name

          Write-Host "Core binaries ready:"
          Get-ChildItem windows/core/

      - name: Build QML app, installer and portable archive
        shell: pwsh
        run: |
          cd windows
          python build_qml.py

      - name: List release assets
        shell: pwsh
        run: Get-ChildItem windows/dist/Lumen-Setup-windows-x64.exe, windows/dist/Lumen-portable-windows-x64.zip | Format-Table Name, Length

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-portable
          path: windows/dist/Lumen-portable-windows-x64.zip

      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Lumen ${{ env.RELEASE_TAG }}"
          body_path: CHANGELOG.md
          generate_release_notes: false
          make_latest: true
          overwrite_files: true
          files: |
            windows/dist/Lumen-Setup-windows-x64.exe
            windows/dist/Lumen-portable-windows-x64.zip
