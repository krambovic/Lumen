name: Windows Rust Pre-Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packages as a GitHub prerelease
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/rust-package.yml
    with:
      prerelease: true
      publish: ${{ inputs.publish }}
