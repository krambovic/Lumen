android.useAndroidX=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
# The build needs JDK 17 (pinned portably via kotlin.jvmToolchain in app/build.gradle.kts).
# Gradle picks it up from JAVA_HOME or any detected installation; a machine whose JDK lives in a
# non-standard directory sets org.gradle.java.home in ~/.gradle/gradle.properties, never here.
